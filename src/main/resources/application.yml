spring:
  application:
    name: payment-router

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/payment_router}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: text-embedding-3-small
      chat:
        options:
          model: gpt-4o-mini
    model:
      embedding: openai
      chat: openai
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        initialize-schema: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: payment-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: ${PORT:8080}

logging:
  level:
    org.springframework: INFO
    com.dahyvuun: DEBUG
    org.springframework.security: DEBUG
    io.github.resilience4j: DEBUG

exchange-rate:
  api-key: ${EXCHANGE_RATE_API_KEY}
  base-url: https://v6.exchangerate-api.com/v6

resilience4j:
  circuitbreaker:
    instances:
      exchangeRateApi:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        minimum-number-of-calls: 5
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - com.dahyvuun.payment_router.exception.ExternalApiException
        ignore-exceptions:
          - com.dahyvuun.payment_router.exception.ResourceNotFoundException
          - java.lang.IllegalStateException

      paymentGateway:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        failure-rate-threshold: 40
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        minimum-number-of-calls: 10
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - com.dahyvuun.payment_router.exception.ExternalApiException
        ignore-exceptions:
          - com.dahyvuun.payment_router.exception.ResourceNotFoundException
          - java.lang.IllegalStateException

  retry:
    instances:
      exchangeRateApi:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.reactive.function.client.WebClientRequestException
        ignore-exceptions:
          - com.dahyvuun.payment_router.exception.ResourceNotFoundException

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,circuitbreakerevents,retries,retryevents,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  health:
    circuitbreakers:
      enabled: true
    retries:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: payment-router